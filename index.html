<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quant Market Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:'Inter',sans-serif;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:30px;
}

.header{
  text-align:center;
  margin-bottom:35px;
}

.header h1{
  font-size:54px;
  margin:0;
  letter-spacing:-2px;
}

.header p{
  color:#888;
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:24px;
}

.card{
  background:#171717;
  border-radius:28px;
  padding:24px;
  transition:0.3s;
  overflow:hidden;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.symbol{
  font-size:40px;
  font-weight:700;
}

.label{
  color:#888;
  margin-top:5px;
}

.badge{
  padding:10px 14px;
  border-radius:14px;
  font-size:12px;
  font-weight:700;
}

.drawdown{
  font-size:64px;
  font-weight:700;
  margin-top:18px;
  margin-bottom:6px;
}

.details{
  color:#aaa;
  line-height:1.7;
  font-size:15px;
}

.zoneBar{
  display:flex;
  gap:10px;
  margin-top:20px;
  margin-bottom:22px;
}

.zone{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:12px;
  font-size:12px;
  font-weight:700;
  background:#262626;
}

iframe{
  border:none;
  border-radius:16px;
}

.footer{
  margin-top:40px;
  text-align:center;
  color:#666;
  font-size:13px;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">
    <h1>Quant Market Dashboard</h1>
    <p>Live market drawdown monitoring</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    Updates every 4 hours
  </div>

</div>

<script>

const assets = [

  {
    symbol:"VOO",
    label:"S&P 500 ETF",
    exchange:"AMEX"
  },

  {
    symbol:"QQQ",
    label:"Nasdaq 100",
    exchange:"NASDAQ"
  },

  {
    symbol:"SCHD",
    label:"Dividend ETF",
    exchange:"NYSEARCA"
  },

  {
    symbol:"VXUS",
    label:"International ETF",
    exchange:"NASDAQ"
  },

  {
    symbol:"TSLA",
    label:"Tesla",
    exchange:"NASDAQ"
  },

  {
    symbol:"NVDA",
    label:"NVIDIA",
    exchange:"NASDAQ"
  },

  {
    symbol:"AAPL",
    label:"Apple",
    exchange:"NASDAQ"
  }

];

const grid = document.getElementById("grid");

function getStatus(drawdown){

  if(drawdown <= -30){
    return {
      text:"EXTREME BUY",
      color:"#ff0000"
    };
  }

  if(drawdown <= -20){
    return {
      text:"BUY ZONE",
      color:"#ff3b30"
    };
  }

  if(drawdown <= -10){
    return {
      text:"CORRECTION",
      color:"#ff9800"
    };
  }

  return {
    text:"NORMAL",
    color:"#00c853"
  };
}

async function fetchData(asset){

  // STABLE FREE API
  // Uses Stooq historical CSV

  try{

    const response =
      await fetch(
        `https://stooq.com/q/d/l/?s=${asset.symbol.toLowerCase()}&i=d`
      );

    const text = await response.text();

    const rows =
      text.trim().split("\n").slice(1);

    const closes =
      rows.map(r => parseFloat(r.split(",")[4]))
          .filter(v => !isNaN(v));

    const oneYear =
      closes.slice(-252);

    const current =
      oneYear[oneYear.length - 1];

    const high =
      Math.max(...oneYear);

    const drawdown =
      ((current - high) / high) * 100;

    return {
      current,
      high,
      drawdown
    };

  }catch(e){

    return null;

  }
}

function makeCard(asset,data){

  const status =
    getStatus(data.drawdown);

  const card =
    document.createElement("div");

  card.className = "card";

  card.style.border =
    `3px solid ${status.color}`;

  card.style.boxShadow =
    `0 0 30px ${status.color}33`;

  card.innerHTML = `

    <div class="top">

      <div>

        <div class="symbol"
             style="color:${status.color}">
          ${asset.symbol}
        </div>

        <div class="label">
          ${asset.label}
        </div>

      </div>

      <div class="badge"
           style="
             background:${status.color};
             color:white;
           ">
        ${status.text}
      </div>

    </div>

    <div class="drawdown">
      ${data.drawdown.toFixed(1)}%
    </div>

    <div class="details">

      Current Price:
      $${data.current.toFixed(2)}

      <br>

      1Y High:
      $${data.high.toFixed(2)}

    </div>

    <div class="zoneBar">

      <div class="zone"
           style="
             background:
             ${data.drawdown <= -10
               ? '#ff9800'
               : '#262626'}
           ">
        -10%
      </div>

      <div class="zone"
           style="
             background:
             ${data.drawdown <= -20
               ? '#ff3b30'
               : '#262626'}
           ">
        -20%
      </div>

      <div class="zone"
           style="
             background:
             ${data.drawdown <= -30
               ? '#ff0000'
               : '#262626'}
           ">
        -30%
      </div>

    </div>

    <iframe
      src="
      https://s.tradingview.com/widgetembed/
      ?symbol=${asset.exchange}%3A${asset.symbol}
      &interval=D
      &theme=dark
      "
      width="100%"
      height="240"
      scrolling="no">
    </iframe>

  `;

  grid.appendChild(card);
}

async function build(){

  grid.innerHTML = "";

  for(const asset of assets){

    const data =
      await fetchData(asset);

    if(data){
      makeCard(asset,data);
    }

  }
}

build();

// refresh every 4 hours

setInterval(build,14400000);

</script>

</body>
</html>
